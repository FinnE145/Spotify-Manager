<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Symr — Org Canvas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div id="toolbar">
    <button id="pull-btn">Pull library</button>
    <button id="export-btn">Copy as text</button>
    <label>Zoom
      <input id="zoom-slider" type="range" min="0.25" max="2" step="0.01" value="1">
    </label>
    <label>Card scale
      <input id="scale-slider" type="range" min="0.4" max="1.5" step="0.01" value="1">
    </label>
    <label>Cutoff
      <input id="cutoff-input" type="number" min="1" step="10" value="300">
    </label>
    <label>
      <input id="radius-checkbox" type="checkbox">
      Show grouping radius
    </label>
    <span id="status"></span>
  </div>

  <div id="main">
    <div id="tray"></div>
    <div id="viewport">
      <div id="world"></div>
      <div id="marquee" hidden></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/canvas.js') }}"></script>
</body>
</html>
