<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Symr{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/format.js') }}"></script>
  <script src="{{ url_for('static', filename='js/generation_confirm.js') }}"></script>
  <script src="{{ url_for('static', filename='js/search.js') }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav id="navbar">
    <div class="nav-primary">
      <a href="{{ url_for('index') }}" class="nav-wordmark">Symr</a>
      <a href="{{ url_for('index') }}" class="{{ 'active' if active == 'home' }}">Home</a>
      <a href="{{ url_for('canvas') }}" class="{{ 'active' if active == 'canvas' }}">Canvas</a>
      <a href="{{ url_for('audit') }}" class="{{ 'active' if active == 'audit' }}">Audit</a>
      <a href="{{ url_for('covers') }}" class="{{ 'active' if active == 'covers' }}">Cover Library</a>
      <a href="{{ url_for('folders') }}" class="{{ 'active' if active == 'folders' }}">Folder Structure</a>
      <a href="{{ url_for('analytics') }}" class="{{ 'active' if active == 'analytics' }}">Analytics</a>
    </div>
    <div class="nav-utility">
      <form method="get" action="{{ url_for('search_page') }}" class="nav-search" id="nav-search-form">
        <input type="text" name="q" placeholder="Search" aria-label="Search" id="nav-search-input" autocomplete="off">
        <button type="submit" aria-label="Search">&rarr;</button>
        <div id="nav-search-dropdown" class="search-dropdown" hidden></div>
      </form>
      <a href="{{ url_for('dev_index') }}" class="nav-icon {{ 'active' if active and active.startswith('dev') }}"
         title="Dev" aria-label="Dev">⚙</a>
    </div>
  </nav>

  {% if scoring_failed %}
  <div class="scoring-banner">
    Background score recompute is failing: {{ scoring_error }} &middot;
    <a href="{{ url_for('dev_scoring') }}">/dev/scoring</a>
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
