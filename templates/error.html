{% extends "base.html" %}

{% block title %}Symr — Error {{ code }}{% endblock %}

{% block content %}
<main class="page">
  <h1>{{ code }} — {{ name }}</h1>
  <p class="meta">{{ method }} {{ path }}</p>
  {% if detail %}
  <div class="panel">{{ detail }}</div>
  {% endif %}
  {% if exc %}
  <div class="panel error">{{ exc }}</div>
  {% endif %}
</main>
{% endblock %}
