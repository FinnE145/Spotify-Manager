[pytest]
testpaths = tests
# The repo root on sys.path, so `import db` works from tests/ under a bare
# `pytest` as well as under the documented `venv/bin/python -m pytest`
# (only the latter puts cwd there by itself). tests/ has no __init__.py, so
# without this pytest would put tests/ on the path and nothing else.
pythonpath = .
